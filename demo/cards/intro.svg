<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#1c1b19" fill-opacity="0.42"/>
  <rect x="0" y="0" width="810" height="720" fill="#1c1b19" fill-opacity="0.97"/>
  <rect x="0" y="0" width="18" height="720" fill="#c2410c"/>
  <text x="56" y="66" fill="#ff9a6b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">AGENTWIRE · WHY IT EXISTS</text>
  <text x="56" y="135" fill="#a9ada7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">THE PROBLEM</text>
  <text x="56" y="218" fill="#f1eee4" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900">AGENT DEPENDENCIES</text>
  <text x="56" y="290" fill="#f1eee4" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900">CHANGE SILENTLY.</text>
  <text x="56" y="354" fill="#c5c7c2" font-family="Arial, Helvetica, sans-serif" font-size="24">MCP servers rename tools, APIs deprecate models,</text>
  <text x="56" y="390" fill="#c5c7c2" font-family="Arial, Helvetica, sans-serif" font-size="24">SDKs ship majors. Nobody emails you the diff.</text>
  <text x="56" y="426" fill="#c5c7c2" font-family="Arial, Helvetica, sans-serif" font-size="24">AgentWire diffs 119 URLs across 48 sources, daily.</text>
  <rect x="56" y="496" width="698" height="150" fill="#c2410c"/>
  <text x="84" y="538" fill="#f1eee4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">END USER</text>
  <text x="84" y="586" fill="#f1eee4" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">TEAMS RUNNING AGENTS</text>
  <text x="84" y="624" fill="#f1eee4" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">IN PRODUCTION</text>
</svg>
